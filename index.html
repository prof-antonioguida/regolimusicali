  function noteHead(cx, cy, filled){
    return '<ellipse cx="'+cx.toFixed(1)+'" cy="'+cy.toFixed(1)+'" rx="4.4" ry="3.3" fill="'+(filled?'#1c1c1c':'none')+'" stroke="#1c1c1c" stroke-width="1.1" transform="rotate(-18 '+cx.toFixed(1)+' '+cy.toFixed(1)+')"/>';
  }

  function restGlyph(cx, baselineY, units){
    var html = '';
    var midY = baselineY - STAFF_STEP_PX*4;
    if(units===8){
      var topY4 = baselineY - 6*STAFF_STEP_PX; /* line 4: whole rest hangs below it */
      html += '<rect x="'+(cx-4.5).toFixed(1)+'" y="'+topY4.toFixed(1)+'" width="9" height="4" fill="#1c1c1c"/>';
    } else if(units===4){
      var line3Y = baselineY - 4*STAFF_STEP_PX; /* line 3 (middle): half rest sits above it */
      html += '<rect x="'+(cx-4.5).toFixed(1)+'" y="'+(line3Y-4).toFixed(1)+'" width="9" height="4" fill="#1c1c1c"/>';
    } else if(units===2){
      html += '<g transform="translate('+(cx-6.5).toFixed(1)+','+(midY-13).toFixed(1)+') scale(0.5)">' +
        '<path d="M 1.8 0.0 L 1.5 0.3 L 1.5 1.2 L 5.9 7.1 L 5.9 8.1 L 0.3 16.5 L 0.2 18.0 L 6.2 25.5 L 3.7 25.7 L 2.2 26.4 L 1.2 27.4 L 0.3 28.9 L 0.0 31.1 L 1.2 33.6 L 5.5 39.3 L 6.6 40.0 L 6.9 39.8 L 7.1 39.0 L 4.9 35.1 L 4.5 33.8 L 5.2 31.6 L 6.7 30.4 L 8.2 30.3 L 9.6 30.8 L 11.8 32.3 L 12.4 32.3 L 12.8 31.8 L 12.4 30.9 L 5.7 22.7 L 5.9 21.8 L 11.4 13.6 L 11.4 12.4 L 2.9 0.7 Z" fill="#1c1c1c"/></g>';
    } else {
      html += '<g transform="translate('+(cx-6).toFixed(1)+','+(midY-13).toFixed(1)+') scale(0.46)">' +
        '<path d="M 23.2 0.0 L 21.8 0.5 L 18.9 5.0 L 15.8 8.4 L 13.8 9.8 L 10.9 10.9 L 12.2 8.4 L 12.2 5.4 L 11.2 3.1 L 9.1 1.3 L 6.6 0.5 L 3.8 1.0 L 1.4 2.7 L 0.2 5.0 L 0.0 7.8 L 1.3 10.7 L 3.2 12.2 L 6.5 13.4 L 10.2 13.5 L 13.7 12.6 L 16.4 11.0 L 19.3 8.3 L 9.4 39.2 L 11.6 40.0 L 23.9 1.6 L 23.9 0.7 Z" fill="#1c1c1c"/></g>';
    }
    return html;
  }

  function computeConjunctOffsets(steps, stemUp){
    var sorted = steps.slice().sort(function(a,b){ return a-b; });
    var offsets = {};
    sorted.forEach(function(s){ offsets[s] = 0; });
    var noteOffset = 7.5;
    for(var i=1;i<sorted.length;i++){
      if(sorted[i]-sorted[i-1]===1){
        if(stemUp){ offsets[sorted[i]] = noteOffset; }
        else { offsets[sorted[i-1]] = -noteOffset; }
      }
    }
    return offsets;
  }

  function renderNoteOrChord(cx, baselineY, ev, noFlag, forcedStemUp, offsetOverride){
    var html = '';
    var steps = ev.lanes.map(function(l){ return LANE_STAFF_STEP[l]; });
    var minStep = Math.min.apply(null, steps);
    var maxStep = Math.max.apply(null, steps);
    var stemUp = (typeof forcedStemUp === 'boolean') ? forcedStemUp : (maxStep < 4); /* below the middle line -> stem up on the right */
    var filled = ev.units < 4;
    var offsets;
    if(offsetOverride){
      offsets = {};
      ev.lanes.forEach(function(l, li){ offsets[steps[li]] = offsetOverride[l] || 0; });
    } else {
      offsets = computeConjunctOffsets(steps, stemUp);
    }
    steps.forEach(function(st){
      var cy = baselineY - st*STAFF_STEP_PX;
      var noteCx = cx + (offsets[st]||0);
      html += noteHead(noteCx, cy, filled);
      if(st <= -2){
        html += '<line x1="'+(noteCx-7).toFixed(1)+'" y1="'+cy.toFixed(1)+'" x2="'+(noteCx+7).toFixed(1)+'" y2="'+cy.toFixed(1)+'" stroke="#1c1c1c" stroke-width="1"/>';
      }
    });
    if(ev.units !== 8){
      var stemStep = stemUp ? minStep : maxStep;
      var stemNoteY = baselineY - stemStep*STAFF_STEP_PX;
      var stemLen = 26;
      var stemX = stemUp ? cx+4.2 : cx-4.2;
      var stemY2 = stemUp ? stemNoteY-stemLen : stemNoteY+stemLen;
      html += '<line x1="'+stemX.toFixed(1)+'" y1="'+stemNoteY.toFixed(1)+'" x2="'+stemX.toFixed(1)+'" y2="'+stemY2.toFixed(1)+'" stroke="#1c1c1c" stroke-width="1.2"/>';
      if(ev.units === 1 && !noFlag){
        var fy = stemY2;
        if(stemUp){
          html += '<path d="M'+stemX.toFixed(1)+' '+fy.toFixed(1)+' C '+(stemX+7).toFixed(1)+' '+(fy+3).toFixed(1)+', '+(stemX+8).toFixed(1)+' '+(fy+9).toFixed(1)+', '+(stemX+3).toFixed(1)+' '+(fy+13).toFixed(1)+'" fill="none" stroke="#1c1c1c" stroke-width="1.2" stroke-linecap="round"/>';
        } else {
          html += '<path d="M'+stemX.toFixed(1)+' '+fy.toFixed(1)+' C '+(stemX+7).toFixed(1)+' '+(fy-3).toFixed(1)+', '+(stemX+8).toFixed(1)+' '+(fy-9).toFixed(1)+', '+(stemX+3).toFixed(1)+' '+(fy-13).toFixed(1)+'" fill="none" stroke="#1c1c1c" stroke-width="1.2" stroke-linecap="round"/>';
        }
      }
    }
    return html;
  }

  function renderSingleItem(item, baselineY, forcedStemUp, offsetOverride){
    var ev = item.ev, w = item.w;
    if(ev.type==='chord'){
      var noteCx = item.x + Math.min(NOTATION_UNIT_PX/2, w/2);
      return renderNoteOrChord(noteCx, baselineY, ev, false, forcedStemUp, offsetOverride);
    }
    var restCx = item.x + w/2;
    return restGlyph(restCx, baselineY, ev.units);
  }

  function renderBeamGroup(items, baselineY){
    var html = '';
    var allSteps = [];
    items.forEach(function(it){ it.ev.lanes.forEach(function(l){ allSteps.push(LANE_STAFF_STEP[l]); }); });
    var avgStep = allSteps.reduce(function(a,b){ return a+b; }, 0)/allSteps.length;
    var stemUp = avgStep < 4;
    var stemLen = 26;
    var stemXOff = stemUp ? 4.2 : -4.2;

    var noteInfos = items.map(function(it){
      var steps = it.ev.lanes.map(function(l){ return LANE_STAFF_STEP[l]; });
      var refStep = stemUp ? Math.min.apply(null, steps) : Math.max.apply(null, steps);
      var cx = it.x + Math.min(NOTATION_UNIT_PX/2, it.w/2);
      return {cx:cx, refStep:refStep, steps:steps};
    });

    noteInfos.forEach(function(ni){
      var offsets = computeConjunctOffsets(ni.steps, stemUp);
      ni.steps.forEach(function(st){
        var cy = baselineY - st*STAFF_STEP_PX;
        var noteCx = ni.cx + (offsets[st]||0);
        html += noteHead(noteCx, cy, true);
        if(st <= -2){
          html += '<line x1="'+(noteCx-7).toFixed(1)+'" y1="'+cy.toFixed(1)+'" x2="'+(noteCx+7).toFixed(1)+'" y2="'+cy.toFixed(1)+'" stroke="#1c1c1c" stroke-width="1"/>';
        }
      });
    });

    var first = noteInfos[0], last = noteInfos[noteInfos.length-1];
    var firstNoteY = baselineY - first.refStep*STAFF_STEP_PX;
    var lastNoteY = baselineY - last.refStep*STAFF_STEP_PX;
    var y0 = stemUp ? firstNoteY-stemLen : firstNoteY+stemLen;
    var y1 = stemUp ? lastNoteY-stemLen : lastNoteY+stemLen;
    var x0 = first.cx+stemXOff;
    var x1 = last.cx+stemXOff;

    noteInfos.forEach(function(ni, idx){
      var t = noteInfos.length>1 ? idx/(noteInfos.length-1) : 0;
      var beamY = y0 + (y1-y0)*t;
      var stemX = ni.cx+stemXOff;
      var noteY = baselineY - ni.refStep*STAFF_STEP_PX;
      html += '<line x1="'+stemX.toFixed(1)+'" y1="'+noteY.toFixed(1)+'" x2="'+stemX.toFixed(1)+'" y2="'+beamY.toFixed(1)+'" stroke="#1c1c1c" stroke-width="1.2"/>';
    });

    var beamThickness = 3.2;
    var dx = x1-x0, dy = y1-y0;
    var len = Math.sqrt(dx*dx+dy*dy) || 1;
    var nx = -dy/len*beamThickness/2, ny = dx/len*beamThickness/2;
    var poly = [
      (x0+nx).toFixed(1)+','+(y0+ny).toFixed(1),
      (x1+nx).toFixed(1)+','+(y1+ny).toFixed(1),
      (x1-nx).toFixed(1)+','+(y1-ny).toFixed(1),
      (x0-nx).toFixed(1)+','+(y0-ny).toFixed(1)
    ].join(' ');
    html += '<polygon points="'+poly+'" fill="#1c1c1c"/>';
    return html;
  }

  function buildStaffSystemSVG(measureEventsGroup, showClefAndMeter, isFirstSystem, isLastSystem){
    var topPad = 16;
    var staffTopY = topPad;
    var baselineY = staffTopY + STAFF_LINE_GAP*4; /* bottom line (MI) */
    var leftMargin = showClefAndMeter ? 58 : 14;
    var x = leftMargin;
    var svgParts = [];

    var i, ly;
    for(i=0;i<5;i++){
      ly = staffTopY + i*STAFF_LINE_GAP;
      svgParts.push('<line x1="8" y1="'+ly+'" x2="__WIDTH__" y2="'+ly+'" stroke="#1c1c1c" stroke-width="1"/>');
    }

    if(showClefAndMeter){
      svgParts.push(drawClef(6, staffTopY));
      svgParts.push('<text x="42" y="'+(staffTopY+8).toFixed(1)+'" font-size="15" font-weight="700" font-family="Georgia,serif" text-anchor="middle">'+meter+'</text>');
      svgParts.push('<text x="42" y="'+(staffTopY+24).toFixed(1)+'" font-size="15" font-weight="700" font-family="Georgia,serif" text-anchor="middle">4</text>');
    }

    measureEventsGroup.forEach(function(events, mIdx){
      var measureX = x;
      var cap = capacityPerMeasure();

      var laidOut = events.map(function(ev){
        return {ev:ev, x: measureX + ev.slot*NOTATION_UNIT_PX, w: ev.units*NOTATION_UNIT_PX};
      });

      function avgStepOf(ev){
        var steps = ev.lanes.map(function(l){ return LANE_STAFF_STEP[l]; });
        return steps.reduce(function(a,b){ return a+b; }, 0)/steps.length;
      }
      var slotChords = {};
      laidOut.forEach(function(item){
        if(item.ev.type==='chord'){
          if(!slotChords[item.ev.slot]){ slotChords[item.ev.slot] = []; }
          slotChords[item.ev.slot].push(item.ev);
        }
      });
      Object.keys(slotChords).forEach(function(slotKey){
        var group = slotChords[slotKey];
        if(group.length > 1){
          var maxAvg = Math.max.apply(null, group.map(avgStepOf));
          group.forEach(function(ev){ ev.__forcedStemUp = (avgStepOf(ev) >= maxAvg); });
        }
      });

      var slotOffsets = {};
      Object.keys(slotChords).forEach(function(slotKey){
        var group = slotChords[slotKey];
        if(group.length > 1){
          var allNotes = [];
          group.forEach(function(ev){
            ev.lanes.forEach(function(l){ allNotes.push({lane:l, step:LANE_STAFF_STEP[l], stemUp:ev.__forcedStemUp}); });
          });
          var sortedNotes = allNotes.slice().sort(function(a,b){ return a.step-b.step; });
          var offMap = {};
          for(var si=1; si<sortedNotes.length; si++){
            if(sortedNotes[si].step - sortedNotes[si-1].step === 1){
              if(sortedNotes[si].stemUp){ offMap[sortedNotes[si].lane] = 7.5; }
              else { offMap[sortedNotes[si-1].lane] = -7.5; }
            }
          }
          slotOffsets[slotKey] = offMap;
        }
      });

      var idx = 0;
      while(idx < laidOut.length){
        var item = laidOut[idx];
        if(item.ev.type==='chord' && item.ev.units===1 && typeof item.ev.__forcedStemUp !== 'boolean'){
          var j = idx;
          while(j+1<laidOut.length){
            var nxt = laidOut[j+1];
            var expectedSlot = laidOut[j].ev.slot + laidOut[j].ev.units;
            if(nxt.ev.type==='chord' && nxt.ev.units===1 && nxt.ev.slot===expectedSlot && typeof nxt.ev.__forcedStemUp !== 'boolean'){
              j++;
            } else { break; }
          }
          var runLen = j-idx+1;
          var pos = idx;
          var remaining = runLen;
          while(remaining > 0){
            var groupSize = remaining >= 4 ? 4 : (remaining >= 2 ? 2 : 1);
            if(groupSize >= 2){
              svgParts.push(renderBeamGroup(laidOut.slice(pos, pos+groupSize), baselineY));
            } else {
              svgParts.push(renderSingleItem(laidOut[pos], baselineY));
            }
            pos += groupSize;
            remaining -= groupSize;
          }
          idx = j+1;
        } else {
          svgParts.push(renderSingleItem(item, baselineY, item.ev.__forcedStemUp, slotOffsets[item.ev.slot]));
          idx++;
        }
      }

      x = measureX + cap*NOTATION_UNIT_PX + 8;
      var isFinalBarline = isLastSystem && (mIdx === measureEventsGroup.length-1);
      if(isFinalBarline){
        x += 2;
        svgParts.push('<line x1="'+(x-2.5).toFixed(1)+'" y1="'+staffTopY+'" x2="'+(x-2.5).toFixed(1)+'" y2="'+(staffTopY+STAFF_LINE_GAP*4)+'" stroke="#1c1c1c" stroke-width="1.1"/>');
        svgParts.push('<line x1="'+(x+1.5).toFixed(1)+'" y1="'+staffTopY+'" x2="'+(x+1.5).toFixed(1)+'" y2="'+(staffTopY+STAFF_LINE_GAP*4)+'" stroke="#1c1c1c" stroke-width="3"/>');
        x += 4;
      } else {
        svgParts.push('<line x1="'+x.toFixed(1)+'" y1="'+staffTopY+'" x2="'+x.toFixed(1)+'" y2="'+(staffTopY+STAFF_LINE_GAP*4)+'" stroke="#1c1c1c" stroke-width="1.1"/>');
      }
      if(mIdx < measureEventsGroup.length-1){ x += 6; }
    });

    var lineEndX = Math.max(x, leftMargin+32);
    var totalWidth = lineEndX + 8;
    var totalHeight = staffTopY + STAFF_LINE_GAP*4 + 22;
    var svg = svgParts.join('').split('__WIDTH__').join(lineEndX.toFixed(1));
    return '<svg class="staff-system" viewBox="0 0 '+totalWidth.toFixed(1)+' '+totalHeight.toFixed(1)+'" style="width:100%; height:auto; display:block;">'+svg+'</svg>';
  }

  function buildNotationHTML(){
    var allMeasures = gatherAllMeasureEvents();
    if(allMeasures.length===0 || !hasAnyContent()){
      return '<div class="notation-empty">Il foglio di lavoro &egrave; vuoto: non c&apos;&egrave; nulla da convertire in notazione.</div>';
    }
    var html = '';
    for(var i=0;i<allMeasures.length;i+=MEASURES_PER_SYSTEM){
      var group = allMeasures.slice(i, i+MEASURES_PER_SYSTEM);
      var isLast = (i+MEASURES_PER_SYSTEM) >= allMeasures.length;
      html += buildStaffSystemSVG(group, true, i===0, isLast);
    }
    return html;
  }

  function openNotationModal(){
    document.getElementById('notationBody').innerHTML = buildNotationHTML();
    var box = document.getElementById('notationModalBox');
    box.style.position = '';
    box.style.left = '';
    box.style.top = '';
    box.style.margin = '';
    document.getElementById('notationModal').style.display = 'flex';
  }
  function closeNotationModal(){
    document.getElementById('notationModal').style.display = 'none';
  }

  function setupModalDrag(){
    var header = document.querySelector('#notationModalBox .modal-header');
    var box = document.getElementById('notationModalBox');
    var dragging = false, startX, startY, boxStartLeft, boxStartTop;
    header.style.cursor = 'move';
    header.addEventListener('pointerdown', function(e){
      if(e.target.closest('button')){ return; }
      if(document.fullscreenElement){ return; }
      dragging = true;
      var rect = box.getBoundingClientRect();
      startX = e.clientX; startY = e.clientY;
      boxStartLeft = rect.left; boxStartTop = rect.top;
      box.style.position = 'fixed';
      box.style.margin = '0';
      box.style.left = boxStartLeft+'px';
      box.style.top = boxStartTop+'px';
      document.addEventListener('pointermove', onMove);
      document.addEventListener('pointerup', onUp);
    });
    function onMove(e){
      if(!dragging){ return; }
      box.style.left = (boxStartLeft + (e.clientX-startX))+'px';
      box.style.top = (boxStartTop + (e.clientY-startY))+'px';
    }
    function onUp(){
      dragging = false;
      document.removeEventListener('pointermove', onMove);
      document.removeEventListener('pointerup', onUp);
    }
  }

    var container = document.getElementById('notationPrintContainer');

      }
    });
    document.getElementById('notationModal').addEventListener('click', function(e){
      if(e.target.id === 'notationModal'){ closeNotationModal(); }

      if(e.key === 'Escape' && !document.fullscreenElement){ closeNotationModal(); }

  function getVerificaSelections(){
    var checkedMeter = document.querySelector('input[name="vmeter"]:checked');
    var meterVal = parseInt(checkedMeter ? checkedMeter.value : '4', 10);
    var notes = Array.from(document.querySelectorAll('.v-note-cb:checked')).map(function(cb){ return parseInt(cb.value,10); });
    var sounds = Array.from(document.querySelectorAll('.v-sound-cb:checked')).map(function(cb){ return cb.value; });
    var pauses = Array.from(document.querySelectorAll('.v-pause-cb:checked')).map(function(cb){ return cb.value; });
    var measureCount = Math.max(1, Math.min(64, parseInt(document.getElementById('verificaMeasureCount').value,10) || 8));
    return {meter:meterVal, notes:notes, sounds:sounds, pauses:pauses, measureCount:measureCount};
  }

  function buildMustUseQueue(sel){
    var queue = [];
    sel.sounds.forEach(function(id){ queue.push({units:unitsForRefId(id), kind:'sound'}); });
    sel.pauses.forEach(function(id){ queue.push({units:unitsForRefId(id), kind:'pause'}); });
    for(var i=queue.length-1;i>0;i--){
      var j = Math.floor(Math.random()*(i+1));
      var tmp = queue[i]; queue[i] = queue[j]; queue[j] = tmp;
    }
    return queue;
  }

  function generateRandomMeasureItems(cap, soundUnits, pauseUnits, allowedLanes, mustUseQueue){
    var items = [];
    var pos = 0;
    var guard = 0;
    while(pos < cap && guard < 200){
      guard++;
      var remaining = cap - pos;
      var chosen = null;

      for(var qi=0; qi<mustUseQueue.length; qi++){
        if(mustUseQueue[qi].units <= remaining){
          chosen = mustUseQueue[qi];
          mustUseQueue.splice(qi,1);
          break;
        }
      }

      if(!chosen){
        var candidates = [];
        soundUnits.forEach(function(u){ if(u<=remaining){ candidates.push({units:u, kind:'sound', weight:3}); } });
        pauseUnits.forEach(function(u){ if(u<=remaining){ candidates.push({units:u, kind:'pause', weight:1}); } });
        if(candidates.length===0){ break; }
        var totalWeight = candidates.reduce(function(s,c){ return s+c.weight; }, 0);
        var r = Math.random()*totalWeight;
        for(var ci=0; ci<candidates.length; ci++){
          r -= candidates[ci].weight;
          if(r<=0){ chosen = candidates[ci]; break; }
        }
        if(!chosen){ chosen = candidates[candidates.length-1]; }
      }

      var lane = 0;
      if(chosen.kind==='sound'){
        lane = allowedLanes[Math.floor(Math.random()*allowedLanes.length)];
      }
      items.push({slot:pos, units:chosen.units, kind:chosen.kind, lane:lane});
      pos += chosen.units;
    }
    return items;
  }

  function unitsToSoundInfo(units){
    var id = units===8?'whole':(units===4?'half':(units===2?'quarter':'eighth'));
    return RODS_BY_ID[id];
  }
  function unitsToPauseInfo(units){
    var id = units===8?'whole-rest':(units===4?'half-rest':(units===2?'quarter-rest':'eighth-rest'));
    return RODS_BY_ID[id];
  }

  function runVerifica(){
    var sel = getVerificaSelections();
    var soundUnits = sel.sounds.map(unitsForRefId);
    var pauseUnits = sel.pauses.map(unitsForRefId);
    if(soundUnits.length===0 && pauseUnits.length===0){
      showErrorToast('Seleziona almeno un valore ritmico (suono o pausa) per la Verifica.');
      return;
    }
    if(soundUnits.length>0 && sel.notes.length===0){
      showErrorToast('Seleziona almeno una nota per la Verifica.');
      return;
    }
    pushUndo();
    meter = sel.meter;
    document.querySelectorAll('.meter-btn').forEach(function(b){
      b.classList.toggle('active', parseInt(b.dataset.meter,10)===meter);
    });
    buildWorksheet(sel.measureCount);
    var cap = capacityPerMeasure();
    var mustUseQueue = buildMustUseQueue(sel);
    for(var m=0; m<sel.measureCount; m++){
      var lineIdx = Math.floor(m/MEASURES_PER_LINE);
      var line = lines[lineIdx];
      if(!line){ continue; }
      var localIdx = m % MEASURES_PER_LINE;
      var measureStart = localIdx*cap;
      var items = generateRandomMeasureItems(cap, soundUnits, pauseUnits, sel.notes, mustUseQueue);
      items.forEach(function(it){
        var globalSlot = measureStart + it.slot;
        var info = it.kind==='sound' ? unitsToSoundInfo(it.units) : unitsToPauseInfo(it.units);
        if(!info){ return; }
        var lane = it.kind==='sound' ? it.lane : 0;
        var span = it.kind==='pause' ? LANES.length : 1;
        if(canPlace(line, lane, globalSlot, it.units, span)){
          placeItem(line, globalSlot, info, lane, span);
        }
      });
    }
  }

      var btn = document.getElementById(btnId);

      btn.addEventListener('click', function(e){

        toggleDropdown(dd);
      });
      dd.addEventListener('click', function(e){ e.stopPropagation(); });
    }
    wireDropdown('verificaMeterBtn','verificaMeterDropdown');
    wireDropdown('verificaNotesBtn','verificaNotesDropdown');
    wireDropdown('verificaSoundsBtn','verificaSoundsDropdown');
    wireDropdown('verificaPausesBtn','verificaPausesDropdown');
    wireDropdown('verificaMeasuresBtn','verificaMeasuresDropdown');

    document.addEventListener('click', function(){ closeAllVerificaDropdowns(); });

    document.getElementById('verificaStartBtn').addEventListener('click', function(){
      closeAllVerificaDropdowns();
      runVerifica();
    });
  }
